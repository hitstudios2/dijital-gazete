name: Hit Studios - Otomatik Haber Üretici

on:
  schedule:
    # Sabah 06:00 Türkiye saati = UTC 03:00
    - cron: '0 3 * * *'
    # Akşam 18:00 Türkiye saati = UTC 15:00
    - cron: '0 15 * * *'
  # Elle de tetiklenebilsin (test için)
  workflow_dispatch:

jobs:
  haber-uret:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install cryptography requests

      - name: Haberleri üret ve Firebase'e kaydet
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_KEY:        ${{ secrets.FIREBASE_KEY }}
        run: python fetch_news.py
